name: Issue 30 controlled Godot fragments (temporary registered path)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BAZEL_VERSION: 8.7.0
  GODOT_VERSION: 4.7.1
  RELEASE_VERSION: 0.0.0-pre.0

jobs:
  android-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bazel
        run: |
          curl --fail --location --output "$RUNNER_TEMP/bazel" \
            "https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-linux-x86_64"
          chmod +x "$RUNNER_TEMP/bazel"
      - name: Build canonical fragments
        run: |
          "$RUNNER_TEMP/bazel" build //packages/webview-godot:binding_android \
            --//build:release_version="$RELEASE_VERSION" \
            --platforms=//build/platforms:release_android_arm64
          "$RUNNER_TEMP/bazel" build //packages/webview-godot:binding_web \
            --//build:release_version="$RELEASE_VERSION" \
            --platforms=//build/platforms:release_web_wasm32
      - name: Stage fragments
        run: |
          for platform in android web; do
            mkdir -p "staging/$platform"
            cp -R -L "bazel-bin/packages/webview-godot/binding_${platform}.fragment-tree" "staging/$platform/tree"
            cp "bazel-bin/packages/webview-godot/binding_${platform}.content-manifest.json" "staging/$platform/content-manifest.json"
            cp "bazel-bin/packages/webview-godot/binding_${platform}.fragment-manifest.json" "staging/$platform/fragment-manifest.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: godot-fragment-android
          path: staging/android
      - uses: actions/upload-artifact@v4
        with:
          name: godot-fragment-web
          path: staging/web

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install pinned Bazel
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then architecture=arm64; else architecture=x86_64; fi
          curl --fail --location --output "$RUNNER_TEMP/bazel" \
            "https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-darwin-${architecture}"
          chmod +x "$RUNNER_TEMP/bazel"
      - name: Build canonical fragment
        run: |
          "$RUNNER_TEMP/bazel" build //packages/webview-godot:binding_ios \
            --//build:release_version="$RELEASE_VERSION" \
            --platforms=//build/platforms:release_ios_xcframework
      - name: Stage fragment
        run: |
          mkdir -p staging/ios
          cp -R -L bazel-bin/packages/webview-godot/binding_ios.fragment-tree staging/ios/tree
          cp bazel-bin/packages/webview-godot/binding_ios.content-manifest.json staging/ios/content-manifest.json
          cp bazel-bin/packages/webview-godot/binding_ios.fragment-manifest.json staging/ios/fragment-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: godot-fragment-ios
          path: staging/ios

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bazel
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://github.com/bazelbuild/bazel/releases/download/$env:BAZEL_VERSION/bazel-$env:BAZEL_VERSION-windows-x86_64.exe" `
            -OutFile "$env:RUNNER_TEMP/bazel.exe"
      - name: Build canonical fragment
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/bazel.exe" build //packages/webview-godot:binding_windows `
            "--//build:release_version=$env:RELEASE_VERSION" `
            "--platforms=//build/platforms:release_windows_x86_64"
      - name: Stage fragment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging/windows | Out-Null
          Copy-Item -Recurse -Force bazel-bin/packages/webview-godot/binding_windows.fragment-tree staging/windows/tree
          Copy-Item bazel-bin/packages/webview-godot/binding_windows.content-manifest.json staging/windows/content-manifest.json
          Copy-Item bazel-bin/packages/webview-godot/binding_windows.fragment-manifest.json staging/windows/fragment-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: godot-fragment-windows
          path: staging/windows

  aggregate:
    needs: [android-web, ios, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: godot-fragment-android
          path: release/downloads/android
      - uses: actions/download-artifact@v4
        with:
          name: godot-fragment-ios
          path: release/downloads/ios
      - uses: actions/download-artifact@v4
        with:
          name: godot-fragment-windows
          path: release/downloads/windows
      - uses: actions/download-artifact@v4
        with:
          name: godot-fragment-web
          path: release/downloads/web
      - name: Generate verified imported-fragment repository
        run: |
          python3 build/generate_fragment_repository.py \
            --downloads release/downloads \
            --output release/fragments
      - name: Install pinned Bazel
        run: |
          curl --fail --location --output "$RUNNER_TEMP/bazel" \
            "https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-linux-x86_64"
          chmod +x "$RUNNER_TEMP/bazel"
      - name: Build and verify public Godot SDK
        run: |
          "$RUNNER_TEMP/bazel" test //packages/webview-godot:sdk_distribution_test \
            --//build:release_version="$RELEASE_VERSION" \
            --//build:use_imported_fragments=true \
            --platforms=//build/platforms:canonical_aggregation \
            --test_output=errors
          "$RUNNER_TEMP/bazel" build //packages/webview-godot:sdk \
            --//build:release_version="$RELEASE_VERSION" \
            --//build:use_imported_fragments=true \
            --platforms=//build/platforms:canonical_aggregation \
            --output_groups=default,package_tree,content_manifest,compatibility,provenance
      - name: Install exact Godot editor and export templates
        run: |
          curl --fail --location --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl --fail --location --output "$RUNNER_TEMP/templates.tpz" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp "$RUNNER_TEMP/templates/templates/"* \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Verify official Godot import and Web export
        run: |
          mkdir -p verification/project verification/project/Build/Web
          unzip -q bazel-bin/packages/webview-godot/_sdk_zip.zip -d verification/project
          cp packages/webview-godot/tests/distribution_project/* verification/project/
          godot="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          test "$("$godot" --version)" = "4.7.1.stable.official.a13da4feb"
          "$godot" --headless --path verification/project --editor --quit
          export_path="$PWD/verification/project/Build/Web/index.html"
          "$godot" --headless --path verification/project \
            --export-release Web "$export_path"
          grep -q '<!-- VERVE_WEBVIEW_CORE -->' \
            verification/project/Build/Web/index.html
          for payload in api-contract.js verve_webview_core.js \
            verve_webview_core_bg.wasm verve_webview_core_facade.js \
            verve_webview_web_backend.js; do
            cmp "verification/project/addons/verve_webview/bin/web/$payload" \
              "verification/project/Build/Web/VerveWebViewCore/$payload"
          done
      - name: Stage final artifact
        run: |
          mkdir -p release/final
          cp bazel-bin/packages/webview-godot/_sdk_zip.zip \
            "release/final/verve-webview-godot-${RELEASE_VERSION}.zip"
          cp -R -L bazel-bin/packages/webview-godot/_sdk_merge.package-tree \
            release/final/package-tree
      - uses: actions/upload-artifact@v4
        with:
          name: godot-sdk-distribution
          path: release/final
